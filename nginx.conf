server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker must be revalidated on every load, otherwise a stale
  # worker could keep an old precache manifest and an old app shell.
  # Exact-match location takes precedence over the regex asset block below.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
