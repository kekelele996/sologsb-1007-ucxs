server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker and app shell must never be cached, otherwise updated
  # builds and cache-busting logic never reach returning proofreaders.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
